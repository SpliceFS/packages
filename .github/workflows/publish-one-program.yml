name: Publish one program
# Every job has a time limit: 3 times its longest run, so a hang fails in minutes.

# Builds and tests the packages of one program of SpliceFS (server or client), for its latest
# GitHub release, and leaves them for the publish job of publish-program.yml, which calls this
# once for each program of programs/ when a number tag is pushed; nothing else starts it. No job
# here talks to the package site over rsync: the fetch job of the caller read what is published
# (the artifact published-repos), and its publish job writes (scripts/site-order-test.sh proves
# it). Only the jobs that sign are in the publish environment, which holds the signing keys; each
# of them removes its key files at its end.
#
#   verify -> packages -> freebsd (each)
#                packages -> tests
#
# The packages are built once, from the archives of the release (proven by their signature) and
# the source of the program at the tag of the release, and signed with the real keys. The tests
# run on those files, on both CPU types. The jobs that only read the site (verify and the tests)
# use HTTPS, which has no limit of sessions.
#
# What is published: a package is published only when its build comes from a new release of the
# program. The verify job asks the package site (scripts/release-published.sh) whether the deb
# version of the latest release is already there. When it is, the job says so in the summary of the
# run and no later job of the program runs (the packages job is skipped, and so is every job that
# needs it), so no signed packages are left, which is how the publish job of the caller knows. A
# change to the packaging alone publishes nothing: it is tested with the programs of the latest
# release (package-and-test.yml), and the next release of the program is published with it. The
# job reads the site after the wait job of the caller, so that two runs that queue up never
# publish the same release twice.
#
# FreeBSD: one job for each release in packaging/freebsd/releases builds the packages of both
# CPU types in a machine of that release, from the same verified archives, on top of the
# published repository that the fetch job handed on, installs the amd64 one from the
# repository it signed with the Alpine key (the install check of make package-freebsd) and hands
# its part of the repository to the publish job.
on:
  workflow_call:
    inputs:
      program:
        description: The program to publish, a folder of programs/ (server or client)
        type: string
        required: true

permissions:
  contents: read

jobs:
  # Says which release of the program this run is about, once, so that every other job reads the
  # same values: its latest published release (GitHub never calls a draft the latest). Nothing is
  # built from a tag that is not a version tag, nor from a release whose packages are on the
  # package site already. The newest package on the site, which the upgrade tests start from, is
  # read here too, once. Both are read after the wait job of the caller, because an earlier run
  # may be adding a package right now. This job holds no key.
  verify:
    name: The latest release of the program
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      repository: ${{ steps.release.outputs.repository }}
      published: ${{ steps.published.outputs.published }}
      upgrade-from: ${{ steps.newest.outputs.version }}
      freebsd-releases: ${{ steps.freebsd.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The latest release is a version tag
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PROGRAM: ${{ inputs.program }}
        run: |
          # program-conf.sh refuses a name that is not a program of programs/.
          . scripts/program-conf.sh
          tag="$(gh release view --repo "$release_repo" --json tagName --jq .tagName)"
          if ! printf '%s' "$tag" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "::error::the latest release of $release_repo is $tag, which is not a version tag like v1.2.3"
            exit 1
          fi
          {
            echo "tag=$tag"
            echo "repository=$release_repo"
          } >> "$GITHUB_OUTPUT"
      # A release is published once: nothing of it is built again.
      - name: The release is not on the package site yet
        id: published
        env:
          PROGRAM: ${{ inputs.program }}
          TAG: ${{ steps.release.outputs.tag }}
        run: |
          if [ "$(scripts/release-published.sh "$PROGRAM" "$TAG")" = published ]; then
            line="$PROGRAM $TAG is already published: nothing to publish"
            echo "$line"
            echo "$line" >> "$GITHUB_STEP_SUMMARY"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "$PROGRAM $TAG is not published yet"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      # What people have installed is what the site serves: the upgrade tests start from the newest
      # package there, which is not the release of this run (a release carries no packages).
      - name: The newest package on the package site
        id: newest
        env:
          PROGRAM: ${{ inputs.program }}
        run: |
          version="$(scripts/published-newest.sh "$PROGRAM")"
          echo "newest published package of $PROGRAM: ${version:-none}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
      # Read once here, so that every job builds the same releases and a new release in the list
      # needs no edit of this file.
      - name: List the FreeBSD releases as JSON
        id: freebsd
        run: echo "releases=$(scripts/freebsd-releases.sh)" >> "$GITHUB_OUTPUT"

  # The deb, rpm and apk packages of both CPU types, signed with the real keys, and the signed
  # repositories the tests install from. Only the packages and the public keys are uploaded:
  # dist/keys holds the private keys. It is skipped for a release that is published already, and
  # so is every job that needs it.
  packages:
    name: Signed packages
    needs: verify
    if: needs.verify.outputs.published == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: publish
    env:
      PROGRAM: ${{ inputs.program }}
      TAG: ${{ needs.verify.outputs.tag }}
      UPGRADE_FROM: ${{ needs.verify.outputs.upgrade-from }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The signing secrets are there
        env:
          SIGNING_OPENPGP_SUBKEY: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          SIGNING_ALPINE_KEY: ${{ secrets.SIGNING_ALPINE_KEY }}
        run: scripts/require-env.sh SIGNING_OPENPGP_SUBKEY SIGNING_ALPINE_KEY
      - uses: ./.github/actions/release-keys
        with:
          signing-openpgp-subkey: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          signing-alpine-key: ${{ secrets.SIGNING_ALPINE_KEY }}
      - name: Source of the program at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.verify.outputs.repository }}
          ref: ${{ needs.verify.outputs.tag }}
          path: src
          persist-credentials: false
      - name: Programs of the release, proven by its signature
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ needs.verify.outputs.repository }}
        run: |
          gh release download "$TAG" --repo "$REPOSITORY" --dir release \
            --pattern '*-linux-*.tar.gz' --pattern SHA256SUMS --pattern SHA256SUMS.asc
          scripts/release-bin.sh "$TAG" "$PWD/release" "$PWD/bin"
      - name: Build the deb, rpm and apk packages
        # UPGRADE_FROM is the newest package on the site, read once by the verify job; the
        # upgrade tests start from it.
        run: make packages PROGRAM="$PROGRAM" BIN="$PWD/bin" SRC="$PWD/src" VERSION="$TAG" UPGRADE_FROM="$UPGRADE_FROM"
      - name: Build the signed package repositories
        run: make repo PROGRAM="$PROGRAM"
      # The public keys only, for the tests.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: signed-packages-${{ inputs.program }}
          path: |
            dist/${{ inputs.program }}/
            dist/keys/splicefs.asc
            dist/keys/splicefs.rsa.pub
          if-no-files-found: error
      - name: Remove the secret files
        if: always()
        uses: ./.github/actions/remove-release-keys

  # The FreeBSD packages of both CPU types, one job for each release. FreeBSD cannot run in a
  # container, so each job starts a virtual machine of its release, which needs the hardware
  # virtualization that ubuntu-latest offers. The machine builds the packages, installs the
  # amd64 one from the repository it signed with the Alpine key, starts its service and removes
  # it again, and refuses a repository signed with another key (make package-freebsd). It starts
  # from the catalog that is published, which the fetch job of the caller read after the wait
  # job, so no job of this matrix opens a session to the package site and holds no upload key. It
  # needs the packages job, so it is built only when the packages are. Only the repository
  # folders of its release are uploaded, in one tar because the upload of an artifact refuses the
  # colons in their names.
  freebsd:
    name: FreeBSD packages (${{ matrix.release }})
    needs: [verify, packages]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: publish
    strategy:
      matrix:
        release: ${{ fromJSON(needs.verify.outputs.freebsd-releases) }}
    env:
      PROGRAM: ${{ inputs.program }}
      TAG: ${{ needs.verify.outputs.tag }}
      RELEASE: ${{ matrix.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The signing secrets are there
        env:
          SIGNING_OPENPGP_SUBKEY: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          SIGNING_ALPINE_KEY: ${{ secrets.SIGNING_ALPINE_KEY }}
        run: scripts/require-env.sh SIGNING_OPENPGP_SUBKEY SIGNING_ALPINE_KEY
      - uses: ./.github/actions/release-keys
        with:
          signing-openpgp-subkey: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          signing-alpine-key: ${{ secrets.SIGNING_ALPINE_KEY }}
      - name: Source of the program at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.verify.outputs.repository }}
          ref: ${{ needs.verify.outputs.tag }}
          path: src
          persist-credentials: false
      - name: Programs of the release, proven by its signature
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ needs.verify.outputs.repository }}
        run: |
          gh release download "$TAG" --repo "$REPOSITORY" --dir release \
            --pattern '*-freebsd-*.tar.gz' --pattern SHA256SUMS --pattern SHA256SUMS.asc
          scripts/release-bin.sh "$TAG" "$PWD/release" "$PWD/bin"
      # What is published goes into dist/PROGRAM/repo first, so every older version stays.
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: published-repos
          path: dist
      - name: Start from what is published
        run: make published-unpack PROGRAM="$PROGRAM"
      - name: Build the packages on FreeBSD and the signed repository
        run: make package-freebsd PROGRAM="$PROGRAM" BIN="$PWD/bin" SRC="$PWD/src" VERSION="$TAG" FREEBSD="$RELEASE"
      - name: Pack the repository folders of this release
        run: make freebsd-pack PROGRAM="$PROGRAM" VERSION="$TAG" FREEBSD="$RELEASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd-repo-${{ inputs.program }}-${{ matrix.release }}
          path: dist/${{ inputs.program }}/freebsd-repo-${{ matrix.release }}.tar
          if-no-files-found: error
      - name: Remove the secret files
        if: always()
        uses: ./.github/actions/remove-release-keys

  tests:
    name: Tests
    needs: [verify, packages]
    uses: ./.github/workflows/test-packages.yml
    with:
      program: ${{ inputs.program }}
      artifact: signed-packages-${{ inputs.program }}
