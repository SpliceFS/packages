name: Publish revisions

# A change that reaches main may change the packaging of the programs. For every program of
# programs/ this workflow starts publish-program.yml for the newest release of the program with
# the reason packaging. That run waits for the earlier runs of the program, builds the packages,
# compares them with the newest published revision of the release, and publishes the next
# revision only when they differ; when they do not, as for a change to tests, documents or
# workflows, it ends green and says so. The decision is made there, after the wait, so that two
# changes that follow each other quickly never publish two revisions of the same packaging.
#
# This workflow builds nothing, holds no key and publishes nothing itself.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  start:
    name: Start the publish of each program
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Start publish-program.yml for the newest release of each program
        run: |
          for conf in programs/*/program.conf; do
            PROGRAM="$(basename "$(dirname "$conf")")"
            # The release repository of the program is the program's own fact, so each program
            # is read in a shell of its own.
            tag="$(
              . scripts/program-conf.sh
              gh release view --repo "$release_repo" --json tagName --jq .tagName
            )"
            echo "$PROGRAM $tag: publishing a revision if the packaging changed"
            gh workflow run publish-program.yml --repo "$GITHUB_REPOSITORY" --ref main \
              -f program="$PROGRAM" -f tag="$tag" -f reason=packaging
          done
