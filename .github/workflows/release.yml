name: Release

# A version tag signs the setup script, publishes the site and creates the GitHub release.
# Only version tags can use the publish environment, which holds the signing and upload keys.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Two releases of this repository must not overlap: each one publishes the setup script
  # and its hash, and the later release must be the one that ends up published. So a release
  # waits here until every earlier one has ended. This job holds no key and is not part of
  # the publish environment.
  wait:
    name: Wait for earlier releases
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait until no earlier release is running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          # Run numbers of GitHub only grow, so a smaller one is an earlier release, also
          # when it is a failed release that was started again.
          for attempt in $(seq 1 180); do
            earlier="$(gh api "repos/$REPO/actions/workflows/release.yml/runs?per_page=50" \
              --jq "[.workflow_runs[] | select(.id < $RUN_ID and .status != \"completed\")] | length")"
            if [ "$earlier" = 0 ]; then
              echo "no earlier release is running"
              exit 0
            fi
            echo "$earlier earlier release(s) still running, attempt $attempt"
            sleep 20
          done
          echo "::error::an earlier release did not end within an hour"
          exit 1

  release:
    name: Sign, publish and release
    needs: wait
    runs-on: ubuntu-latest
    environment: publish
    permissions:
      # Needed to create the release.
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      # A tag can sit on any commit. Only a commit on main may publish, and the tag must
      # name the version that VERSION gives. This runs before any key is written.
      - name: The tag is a release of main
        run: |
          # Fetch main by name, so that origin/main is the current tip and not the state
          # of the last checkout.
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tagged commit is not on main, so it cannot be released"
            exit 1
          fi
          version="$(cat VERSION)"
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag is $GITHUB_REF_NAME, but VERSION says v$version"
            exit 1
          fi
      - name: Build the site and run every check
        run: make check
      - name: Write the keys and the known hosts line to files
        env:
          UPLOAD_SSH_KEY: ${{ secrets.UPLOAD_SSH_KEY }}
          SIGNING_OPENPGP_SUBKEY: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          UPLOAD_KNOWN_HOSTS: ${{ vars.UPLOAD_KNOWN_HOSTS }}
        run: |
          umask 077
          printf '%s\n' "$UPLOAD_SSH_KEY" > "$RUNNER_TEMP/upload_key"
          printf '%s\n' "$SIGNING_OPENPGP_SUBKEY" > "$RUNNER_TEMP/signing_key.asc"
          printf '%s\n' "$UPLOAD_KNOWN_HOSTS" > "$RUNNER_TEMP/known_hosts"
      - name: Sign the setup script and verify it with the public key
        env:
          SIGNING_KEY_FILE: ${{ runner.temp }}/signing_key.asc
        run: make sign
      # make publish rebuilds the site first, which removes the signature, so it signs again.
      - name: Publish the site
        env:
          SIGNING_KEY_FILE: ${{ runner.temp }}/signing_key.asc
          UPLOAD_KEY_FILE: ${{ runner.temp }}/upload_key
          UPLOAD_KNOWN_HOSTS_FILE: ${{ runner.temp }}/known_hosts
        run: make publish
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SUM=$(cut -d ' ' -f 1 dist/site/setup.sh.sha256)
          {
            echo "Setup script for $GITHUB_REF_NAME."
            echo
            echo "SHA-256 of setup.sh: \`$SUM\`"
            echo
            echo "Verify the signature with the SpliceFS key (fingerprint in the README):"
            echo
            echo '    curl -fsSLO https://packages.splicefs.org/keys/splicefs.asc'
            echo '    gpg --import splicefs.asc'
            echo '    gpg --verify setup.sh.asc setup.sh'
          } > "$RUNNER_TEMP/notes.md"
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/notes.md" \
            dist/site/setup.sh dist/site/setup.sh.sha256 dist/site/setup.sh.asc
      - name: Remove the secret files
        if: always()
        run: rm -f "$RUNNER_TEMP/upload_key" "$RUNNER_TEMP/signing_key.asc" "$RUNNER_TEMP/known_hosts"

  # The change log page of splicefs.org is built from CHANGELOG.md of this repository, so the
  # website is published again after every release. This job runs outside the publish
  # environment and holds none of its keys. When it fails, the release is out all the same.
  website:
    name: Rebuild the change log page of the website
    needs: release
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Bot token for the website repository
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: SpliceFS
          repositories: org-site
      - name: Ask the website to publish again
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh api repos/SpliceFS/org-site/dispatches -f event_type=release-published
