name: Tag

# Every merge into main is a version, and a version is a plain number: 1, 2, 3. This puts the
# next number on the commit as a tag, which starts the build, and makes the GitHub release of that
# tag, whose notes are the change log entries of the pull requests merged since the previous
# number and a line for every program release published since then (scripts/tag-release.sh). No
# version is written in any file.
#
# A program release (repository_dispatch of type program-released) also gets a number, because
# the packages of a program release are published from a number tag. The dispatch only says "tag
# now": its payload is not read, and the notes read the releases of the programs themselves.
on:
  push:
    branches: [main]
  repository_dispatch:
    types: [program-released]

permissions:
  contents: read

# One run at a time, so two runs never choose the same number. A run that waits is replaced by a
# newer one that waits, and that is fine: the number of the newer run is taken from the tags that
# exist then, and its notes hold every pull request and every program release since the previous
# tag, so the commits and notes of the replaced run are in it, whichever event it was.
concurrency:
  group: number-tags
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the version
    runs-on: ubuntu-latest
    steps:
      # A tag made with the token of the workflow itself would start no workflow. The token of
      # the release bot does, and only the release bot may create tags.
      - name: Bot token
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
      # The whole history and every tag: the next number and the pull requests of the notes are
      # read from them.
      - name: Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Rules
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: SpliceFS/.github
          path: rules
          persist-credentials: false
      - name: Tag the commit and make the release
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          REPO: ${{ github.repository }}
          CHANGE_LOG_SCRIPT: ${{ github.workspace }}/rules/processes/pull-request-rules/v1/change-log.sh
          # Not empty for a program release: that one is tagged even when the tip of main has a
          # number already, which a push never is.
          PROGRAM_RELEASED: ${{ github.event_name == 'repository_dispatch' && 'yes' || '' }}
        run: scripts/tag-release.sh "$GITHUB_SHA"

  # A failed run of this workflow opens an issue assigned to the account in the repository
  # variable ALERT_ASSIGNEE, so that someone gets an email; GitHub sends none for runs the
  # bots start.
  alert:
    name: Report a failure
    needs: [tag]
    if: ${{ failure() }}
    permissions:
      issues: write
    uses: SpliceFS/.github/.github/workflows/report-failure-v1.yml@main
    with:
      assignee: ${{ vars.ALERT_ASSIGNEE }}
