name: Package and test
# Every job has a time limit: 3 times its longest run, so a hang fails in minutes.

# Builds the deb, rpm, Alpine and FreeBSD packages of a SpliceFS program, makes the signed
# repositories, and tests them: the deb, rpm and Alpine packages on the server images of
# packaging/test-systems, the FreeBSD packages in a FreeBSD machine of each release of
# packaging/freebsd/releases. A repository that releases a program calls this workflow from
# its own CI:
#
#   packages:
#     name: Packages
#     needs: build
#     uses: SpliceFS/packages/.github/workflows/package-and-test.yml@main
#     with:
#       program: server
#       bin-artifact: bin
#
# bin-artifact is an artifact of the calling run that holds the dist/bin of the program's
# build, laid out <os>-<arch>/<program>. The source tree (the license and the documents that go
# into the packages) and the version are the caller's, at the commit that is being tested.
#
# Without bin-artifact the workflow tests the newest release of the program instead: it
# downloads the release archives, proves them, and builds from the source at the release tag.
# This repository's own CI does that, so that a change to the packaging is tested on its own.
# The packages are then of a version that is published already, so they are built as the next
# revision of it, which is what a change to the packaging alone would be when published; the
# revision comes from the published repository (scripts/next-revision.sh), never from a file.
#
# Every key is a throwaway key made in the run: no secret is given to this workflow, and
# nothing it makes is published. The publish of a release (publish-one-program.yml) builds the
# FreeBSD packages with the same make target, so the checks of the FreeBSD machine, which
# install, start, upgrade and remove the package, run on every pull request and not first at
# publish time.
on:
  workflow_call:
    inputs:
      program:
        description: The program to package, a folder of programs/ (server or client)
        type: string
        required: true
      bin-artifact:
        description: Artifact of the calling run that holds dist/bin; empty tests the newest release
        type: string
        default: ""

permissions:
  contents: read

jobs:
  # What is packaged, and the packages, on both CPU types: build-packages.yml. It says where the
  # source is, the version and revision, and the FreeBSD releases, once, so that every job of the
  # run packages and tests the same thing.
  build:
    name: Build
    uses: ./.github/workflows/build-packages.yml
    with:
      program: ${{ inputs.program }}
      bin-artifact: ${{ inputs.bin-artifact }}

  # The FreeBSD packages and the tests of the deb, rpm and Alpine packages on every system of
  # packaging/test-systems: check-packages.yml. The release of a program runs the same package
  # tests (test-packages.yml) on the packages it publishes.
  check:
    name: Check
    needs: build
    uses: ./.github/workflows/check-packages.yml
    with:
      program: ${{ inputs.program }}
      bin-artifact: ${{ inputs.bin-artifact }}
      source: ${{ toJSON(needs.build.outputs) }}

  # The one result a caller needs. A job that did not run counts as failed: a job is skipped
  # only when one it needs failed. A new job is added to the list when it is added above.
  result:
    name: Result
    needs: [build, check]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s\n' "$NEEDS" | jq -e 'any(.[]; .result != "success")' >/dev/null; then
            echo "::error::At least one job did not succeed."
            exit 1
          fi
