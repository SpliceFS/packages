name: Merge queue

# GitHub's merge queue tests each pull request merged on top of main and the pull requests
# ahead of it, once, and merges in order. CI, Install tests, Security, Rules and SonarQube run
# for the queue as they do for a pull request. Branch protection also requires the check below,
# which SonarQube Cloud posts itself and only for pull requests and main. It was checked when the
# pull request entered the queue, and the queue builds on exactly that pull request, so it passes
# here without running again. The job name is the name branch protection requires; nothing else
# runs this name for the queue.
on:
  merge_group:
    types: [checks_requested]

permissions:
  contents: read

jobs:
  sonar-status:
    name: SonarCloud Code Analysis
    runs-on: ubuntu-latest
    steps:
      - run: echo "SonarQube Cloud reports on pull requests, not on queue branches; it reported on the pull request."
