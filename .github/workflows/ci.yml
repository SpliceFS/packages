name: CI
# Every job has a time limit: 3 times its longest run, so a hang fails in minutes.

# Only pull requests are tested. main gets nothing but branches that passed here, so a run on
# main would test the same files a second time.
on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Which test groups the change needs (changes.yml). A job of a group the change cannot affect
  # is skipped; the checks run for every change.
  changes:
    name: Changes
    uses: ./.github/workflows/changes.yml

  check:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the site and check the script and the redirect page
        run: make check

  # The versions the packages are given sort right in dpkg, rpm and Alpine's apk. The answer
  # depends on this repository only, not on a program, a package or a CPU type, so one job is
  # enough for the run.
  version-order:
    name: Version order
    needs: changes
    if: needs.changes.outputs.formats != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the order of the package versions in each package manager
        run: make package-order-test

  # The packaging is tested on the newest release of each program: the release archives are
  # proven by their signature, packaged with the definitions of this commit, and the packages
  # are tested on the server images. A change to a definition, a script or a test system
  # shows here before it reaches a release of a program. The build and the tests are two calls
  # because the package test of both programs together needs only the packages, and must not wait
  # for the tests of each package. One call for each program, not a matrix: what a build says (the version, the
  # newest release) is the output of the job, and the output of a matrix is that of one leg.
  # The jobs that need these builds are skipped with them.
  packages-server:
    name: Packages server
    needs: changes
    if: needs.changes.outputs.formats != '[]' || contains(fromJSON(needs.changes.outputs.groups), 'freebsd')
    uses: ./.github/workflows/build-packages.yml
    with:
      program: server
      formats: ${{ needs.changes.outputs.formats }}

  packages-client:
    name: Packages client
    needs: changes
    if: needs.changes.outputs.formats != '[]' || contains(fromJSON(needs.changes.outputs.groups), 'freebsd')
    uses: ./.github/workflows/build-packages.yml
    with:
      program: client
      formats: ${{ needs.changes.outputs.formats }}

  released-server:
    name: Released server
    needs: [changes, packages-server]
    uses: ./.github/workflows/check-packages.yml
    with:
      program: server
      formats: ${{ needs.changes.outputs.formats }}
      freebsd: ${{ contains(fromJSON(needs.changes.outputs.groups), 'freebsd') }}
      package-test: false
      source: ${{ toJSON(needs.packages-server.outputs) }}

  released-client:
    name: Released client
    needs: [changes, packages-client]
    uses: ./.github/workflows/check-packages.yml
    with:
      program: client
      formats: ${{ needs.changes.outputs.formats }}
      freebsd: ${{ contains(fromJSON(needs.changes.outputs.groups), 'freebsd') }}
      package-test: false
      source: ${{ toJSON(needs.packages-client.outputs) }}

  # The package test (scripts/package-test.sh) of both programs together, in one boot of each
  # system: install the published packages of both, upgrade to the new ones, enable and start the
  # services, restart, reboot, stop, disable, remove as the documentation says, and find the system
  # as it was. It needs the packages of the server and of the client in one run, and a call of
  # package-and-test.yml or test-packages.yml holds one program, so the job is here, where both
  # calls are known (the calls above skip their own package test for that reason). It starts when
  # both builds are done, not when their tests are.
  package-test:
    name: Package test of both programs (${{ matrix.format }}, ${{ matrix.arch }})
    needs: [changes, packages-server, packages-client]
    if: needs.changes.outputs.formats != '[]'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        format: ${{ fromJSON(needs.changes.outputs.formats) }}
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    env:
      FORMAT: ${{ matrix.format }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-server-${{ matrix.arch }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: packages-client-${{ matrix.arch }}
          path: dist
      - name: Install, upgrade, run and remove both programs in a clean system of every release
        run: make package-test ONLY="$FORMAT"

  # The package test (scripts/freebsd-package-test.sh) on FreeBSD, for both programs in one machine of
  # each release of packaging/freebsd/releases, which boots twice because the machine has no channel to
  # the host while it runs: install the published packages of both, put the new ones over them, enable
  # and start the services, restart the machine, stop, disable, remove as the documentation says, and find
  # the system as it was. It takes the package files that the FreeBSD jobs of the two calls above kept
  # (check-packages.yml), so it starts when both are done. The machine is amd64 and needs the hardware
  # virtualization that ubuntu-latest offers.
  package-test-freebsd:
    name: Package test of both programs (FreeBSD ${{ matrix.release }})
    needs: [changes, packages-server, released-server, released-client]
    if: contains(fromJSON(needs.changes.outputs.groups), 'freebsd')
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        release: ${{ fromJSON(needs.packages-server.outputs.freebsd-releases) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freebsd-packages-server-${{ matrix.release }}
          path: dist/server
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: freebsd-packages-client-${{ matrix.release }}
          path: dist/client
      - name: Install, upgrade, run and remove both programs in a FreeBSD machine
        run: make package-test-freebsd FREEBSD=${{ matrix.release }}

  # The one check a branch must pass. A skipped job passes: it is skipped when the change cannot
  # affect its group, or when a job it needs did not succeed, which that job's own result fails.
  # A failed or cancelled job fails. A new job is added to the list when it is added above, and
  # nowhere else. The other workflows of this repository are separate runs and are not in it.
  all-checks:
    name: All checks
    needs: [changes, check, version-order, packages-server, packages-client, released-server, released-client, package-test, package-test-freebsd]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Every job succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          printf '%s\n' "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if printf '%s\n' "$NEEDS" | jq -e 'any(.[]; .result != "success" and .result != "skipped")' >/dev/null; then
            echo "::error::At least one job did not succeed."
            exit 1
          fi
