name: Publish program

# Publishes the packages of a released program of SpliceFS (server or client) to the package
# site. The release of the program tells this workflow with a repository_dispatch of type
# program-released (client_payload: program, tag), and a person can run it by hand with the same
# two values and the reason. Only the jobs that sign or upload are in the publish environment,
# which holds SIGNING_OPENPGP_SUBKEY, SIGNING_ALPINE_KEY and UPLOAD_SSH_KEY; each of them removes
# its key files at its end.
#
#   verify -> wait -> revision -> packages -> tests ----------+
#                                 packages -> freebsd (each) -+--> publish -> homebrew, website
#   verify, wait ---------------------------------------------+
#
# The packages are built once, from the archives of the release (proven by their signature) and
# the source of the program at the tag, and signed with the real keys. The tests run on those
# files, on both CPU types. The publish job needs all of them. It fetches what is published
# now, adds the packages, makes the signed repositories, and uploads in order: the packages,
# then the index files and their signatures.
#
# Revision: the packages of a release are revision 0. A change to the packaging alone is
# published as the next revision of the current release (scripts/next-revision.sh), by a run with
# the reason packaging that publish-revisions.yml starts for each program when main changes; a
# release has the reason release. The revision job computes the number once, after the wait, so
# that two runs of a program that queue up never take the same one. The packages job builds them
# and, for the reason packaging, compares them with the newest published revision of the release
# (scripts/revision-listings.sh, scripts/revision-decide.sh). When nothing changed, no later job
# runs and the run, which is green, says so in its summary: the decision is made here, after the
# wait, so that two quick changes to main never publish two revisions of the same packaging.
#
# FreeBSD: one job for each release in packaging/freebsd/releases builds the packages of both
# CPU types in a machine of that release, from the same verified archives, installs the amd64
# one from the repository it signed with the Alpine key (the install check of make
# package-freebsd) and hands its part of the repository to the publish job.
on:
  repository_dispatch:
    types: [program-released]
  workflow_dispatch:
    inputs:
      program:
        description: The released program, a folder of programs/ (server or client)
        type: string
        required: true
      tag:
        description: The release of the program to publish, for example v1.2.3
        type: string
        required: true
      reason:
        description: release publishes the release itself; packaging publishes the next revision of it, and only when its packaging changed
        type: choice
        options: [release, packaging]
        default: release

# The program and the tag are in the name, so that the wait job can tell which runs publish the
# same program.
run-name: Publish ${{ github.event.client_payload.program || inputs.program }} ${{ github.event.client_payload.tag || inputs.tag }}

permissions:
  contents: read

# One publish of a program at a time, and none is ever cancelled: the wait job below makes every
# publish wait for the earlier ones of its program. A concurrency group would drop a run that
# waits behind another, and a release that is dropped is never published.
jobs:
  # Says which program and release this run is about, once, so that every other job reads the
  # same values. Nothing is built from a name that is not a program of this repository or from a
  # tag that is not a published release of it. This job holds no key.
  verify:
    name: The release is a published release of a program
    runs-on: ubuntu-latest
    outputs:
      program: ${{ steps.release.outputs.program }}
      tag: ${{ steps.release.outputs.tag }}
      repository: ${{ steps.release.outputs.repository }}
      reason: ${{ steps.release.outputs.reason }}
      freebsd-releases: ${{ steps.freebsd.outputs.releases }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The program is known and the tag is a published release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          PROGRAM: ${{ github.event.client_payload.program || inputs.program }}
          TAG: ${{ github.event.client_payload.tag || inputs.tag }}
          # The release itself comes with the dispatch of the release, which has no reason.
          REASON: ${{ inputs.reason || 'release' }}
        run: |
          # program-conf.sh refuses a name that is not a program of programs/.
          . scripts/program-conf.sh
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$'; then
            echo "::error::the tag $TAG is not a version tag like v1.2.3"
            exit 1
          fi
          draft="$(gh release view "$TAG" --repo "$release_repo" --json isDraft --jq .isDraft)"
          if [ "$draft" != false ]; then
            echo "::error::$TAG of $release_repo is not a published release"
            exit 1
          fi
          {
            echo "program=$PROGRAM"
            echo "tag=$TAG"
            echo "repository=$release_repo"
            echo "reason=$REASON"
          } >> "$GITHUB_OUTPUT"
      # Read once here, so that every job builds the same releases and a new release in the list
      # needs no edit of this file.
      - name: List the FreeBSD releases as JSON
        id: freebsd
        run: |
          lines="$(awk '!/^#/ && NF { print $1 }' packaging/freebsd/releases)"
          printf 'releases=%s\n' "$(printf '%s\n' "$lines" | jq -R -n -c '[inputs | select(length > 0)]')" >> "$GITHUB_OUTPUT"

  # Two publishes of a program must not overlap. Each one builds the repositories on top of what
  # is published, so one that starts while an earlier one is still running would publish without
  # the earlier version. The FreeBSD jobs, which start from the catalog that is published, and
  # the publish job wait here until every earlier run of the same program has ended. This job
  # holds no key and is not part of the publish environment.
  wait:
    name: Wait for earlier publishes of the program
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Wait until no earlier publish of this program is running
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          PROGRAM: ${{ needs.verify.outputs.program }}
        run: |
          # Run numbers of GitHub only grow, so a smaller one is an earlier publish, also
          # when it is a failed one that was started again. The name of a run starts with
          # "Publish PROGRAM ", and the space keeps one program from matching another.
          for attempt in $(seq 1 180); do
            earlier="$(gh api "repos/$REPO/actions/workflows/publish-program.yml/runs?per_page=100" \
              --jq "[.workflow_runs[] | select(.id < $RUN_ID and .status != \"completed\" and (.display_title | startswith(\"Publish $PROGRAM \")))] | length")"
            if [ "$earlier" = 0 ]; then
              echo "no earlier publish of $PROGRAM is running"
              exit 0
            fi
            echo "$earlier earlier publish(es) of $PROGRAM still running, attempt $attempt"
            sleep 20
          done
          echo "::error::an earlier publish of $PROGRAM did not end within an hour"
          exit 1

  # The revision of the packages, once, for every job that builds them. A release that was just
  # made is revision 0 whatever the repository holds, so that a second delivery of the same
  # release is refused when it publishes (it would replace a published file) and never becomes a
  # revision of its own. A run for a packaging change takes the revision after the highest
  # published; it is computed here, after the wait, because
  # an earlier run of the program may be adding a revision right now. This job holds no key.
  revision:
    name: The revision of the packages
    needs: [verify, wait]
    runs-on: ubuntu-latest
    outputs:
      revision: ${{ steps.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The next revision of the release
        id: revision
        env:
          REASON: ${{ needs.verify.outputs.reason }}
          PROGRAM: ${{ needs.verify.outputs.program }}
          TAG: ${{ needs.verify.outputs.tag }}
        run: |
          revision=0
          if [ "$REASON" = packaging ]; then
            revision="$(scripts/next-revision.sh "$PROGRAM" "$TAG")"
          fi
          echo "$PROGRAM $TAG is built as revision $revision"
          echo "revision=$revision" >> "$GITHUB_OUTPUT"

  # The deb, rpm and apk packages of both CPU types, signed with the real keys, and the signed
  # repositories the tests install from. Only the packages and the public keys are uploaded:
  # dist/keys holds the private keys. A run for a packaging change stops after the build when the
  # packages are the same as the newest published revision (output changed): every job that needs
  # this one is then skipped, and so is every job that needs a skipped one.
  packages:
    name: Signed packages
    needs: [verify, revision]
    runs-on: ubuntu-latest
    environment: publish
    outputs:
      changed: ${{ steps.decide.outputs.changed }}
    env:
      PROGRAM: ${{ needs.verify.outputs.program }}
      TAG: ${{ needs.verify.outputs.tag }}
      REASON: ${{ needs.verify.outputs.reason }}
      REVISION: ${{ needs.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The signing secrets are there
        env:
          SIGNING_OPENPGP_SUBKEY: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          SIGNING_ALPINE_KEY: ${{ secrets.SIGNING_ALPINE_KEY }}
        run: scripts/require-env.sh SIGNING_OPENPGP_SUBKEY SIGNING_ALPINE_KEY
      - uses: ./.github/actions/release-keys
        with:
          signing-openpgp-subkey: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          signing-alpine-key: ${{ secrets.SIGNING_ALPINE_KEY }}
      - name: Source of the program at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.verify.outputs.repository }}
          ref: ${{ needs.verify.outputs.tag }}
          path: src
          persist-credentials: false
      - name: Programs of the release, proven by its signature
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ needs.verify.outputs.repository }}
        run: |
          gh release download "$TAG" --repo "$REPOSITORY" --dir release \
            --pattern '*-linux-*.tar.gz' --pattern SHA256SUMS --pattern SHA256SUMS.asc
          scripts/release-bin.sh "$TAG" "$PWD/release" "$PWD/bin"
      - name: Build the deb, rpm and apk packages
        run: make packages PROGRAM="$PROGRAM" BIN="$PWD/bin" SRC="$PWD/src" VERSION="$TAG" REVISION="$REVISION"
      # A release is published as it is built. A change to the packaging is published only when the
      # packages differ from the newest published revision of the release: right after the build,
      # so that nothing else runs for a change that makes no difference.
      - name: Did the packaging change since the newest published revision
        id: decide
        run: |
          changed=true
          if [ "$REASON" = packaging ]; then
            scripts/revision-listings.sh "$PROGRAM" "$TAG" "$RUNNER_TEMP/listings"
            status=0
            scripts/revision-decide.sh "$PROGRAM" "$TAG" "$RUNNER_TEMP/listings" \
              > "$RUNNER_TEMP/decision" 2> "$RUNNER_TEMP/reason" || status=$?
            cat "$RUNNER_TEMP/reason"
            [ "$status" = 0 ] || exit "$status"
            if [ ! -s "$RUNNER_TEMP/decision" ]; then
              changed=false
              cat "$RUNNER_TEMP/reason" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Build the signed package repositories
        if: steps.decide.outputs.changed == 'true'
        run: make repo PROGRAM="$PROGRAM"
      # The public keys only, for the tests.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.decide.outputs.changed == 'true'
        with:
          name: signed-packages-${{ needs.verify.outputs.program }}
          path: |
            dist/${{ needs.verify.outputs.program }}/
            dist/keys/splicefs.asc
            dist/keys/splicefs.rsa.pub
          if-no-files-found: error
      - name: Remove the secret files
        if: always()
        uses: ./.github/actions/remove-release-keys

  # The FreeBSD packages of both CPU types, one job for each release. FreeBSD cannot run in a
  # container, so each job starts a virtual machine of its release, which needs the hardware
  # virtualization that ubuntu-latest offers. The machine builds the packages, installs the
  # amd64 one from the repository it signed with the Alpine key, starts its service and removes
  # it again, and refuses a repository signed with another key (make package-freebsd). It starts
  # from the catalog that is published now, so it runs after the revision job, which waited until
  # every earlier publish of the program had ended. It is built only when the packages changed.
  # Only the repository folders of its release are uploaded, in one tar
  # because the upload of an artifact refuses the colons in their names.
  freebsd:
    name: FreeBSD packages (${{ matrix.release }})
    needs: [verify, revision, packages]
    if: needs.packages.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment: publish
    strategy:
      matrix:
        release: ${{ fromJSON(needs.verify.outputs.freebsd-releases) }}
    env:
      PROGRAM: ${{ needs.verify.outputs.program }}
      TAG: ${{ needs.verify.outputs.tag }}
      RELEASE: ${{ matrix.release }}
      REVISION: ${{ needs.revision.outputs.revision }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The signing and upload secrets are there
        env:
          SIGNING_OPENPGP_SUBKEY: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          SIGNING_ALPINE_KEY: ${{ secrets.SIGNING_ALPINE_KEY }}
          UPLOAD_SSH_KEY: ${{ secrets.UPLOAD_SSH_KEY }}
          UPLOAD_KNOWN_HOSTS: ${{ vars.UPLOAD_KNOWN_HOSTS }}
        run: scripts/require-env.sh SIGNING_OPENPGP_SUBKEY SIGNING_ALPINE_KEY UPLOAD_SSH_KEY UPLOAD_KNOWN_HOSTS
      # The upload key is for the download of what is published now.
      - uses: ./.github/actions/release-keys
        with:
          signing-openpgp-subkey: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          signing-alpine-key: ${{ secrets.SIGNING_ALPINE_KEY }}
          upload-ssh-key: ${{ secrets.UPLOAD_SSH_KEY }}
          upload-known-hosts: ${{ vars.UPLOAD_KNOWN_HOSTS }}
      - name: Source of the program at the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.verify.outputs.repository }}
          ref: ${{ needs.verify.outputs.tag }}
          path: src
          persist-credentials: false
      - name: Programs of the release, proven by its signature
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ needs.verify.outputs.repository }}
        run: |
          gh release download "$TAG" --repo "$REPOSITORY" --dir release \
            --pattern '*-freebsd-*.tar.gz' --pattern SHA256SUMS --pattern SHA256SUMS.asc
          scripts/release-bin.sh "$TAG" "$PWD/release" "$PWD/bin"
      # What is published now goes into dist/PROGRAM/repo first, so every older version stays.
      - name: Download the published repositories
        run: make program-fetch PROGRAM="$PROGRAM"
      - name: Build the packages on FreeBSD and the signed repository
        run: make package-freebsd PROGRAM="$PROGRAM" BIN="$PWD/bin" SRC="$PWD/src" VERSION="$TAG" REVISION="$REVISION" FREEBSD="$RELEASE"
      - name: Pack the repository folders of this release
        run: make freebsd-pack PROGRAM="$PROGRAM" VERSION="$TAG" REVISION="$REVISION" FREEBSD="$RELEASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: freebsd-repo-${{ needs.verify.outputs.program }}-${{ matrix.release }}
          path: dist/${{ needs.verify.outputs.program }}/freebsd-repo-${{ matrix.release }}.tar
          if-no-files-found: error
      - name: Remove the secret files
        if: always()
        uses: ./.github/actions/remove-release-keys

  tests:
    name: Tests
    needs: [verify, packages]
    if: needs.packages.outputs.changed == 'true'
    uses: ./.github/workflows/test-packages.yml
    with:
      program: ${{ needs.verify.outputs.program }}
      artifact: signed-packages-${{ needs.verify.outputs.program }}
      packages-ref: ${{ github.sha }}

  # The only job that uploads. It waits for every job above, then publishes in this order: the
  # packages, then the index files and their signatures (the two passes of
  # scripts/publish-program.sh), the FreeBSD catalogs and their signatures among them. The repositories are made here and not in the packages job
  # because they are made from what is published now, so they must come from the state at the
  # time of the upload.
  publish:
    name: Publish
    needs: [verify, wait, packages, freebsd, tests]
    runs-on: ubuntu-latest
    environment: publish
    env:
      PROGRAM: ${{ needs.verify.outputs.program }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The signing and upload secrets are there
        env:
          SIGNING_OPENPGP_SUBKEY: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          SIGNING_ALPINE_KEY: ${{ secrets.SIGNING_ALPINE_KEY }}
          UPLOAD_SSH_KEY: ${{ secrets.UPLOAD_SSH_KEY }}
          UPLOAD_KNOWN_HOSTS: ${{ vars.UPLOAD_KNOWN_HOSTS }}
        run: scripts/require-env.sh SIGNING_OPENPGP_SUBKEY SIGNING_ALPINE_KEY UPLOAD_SSH_KEY UPLOAD_KNOWN_HOSTS
      - uses: ./.github/actions/release-keys
        with:
          signing-openpgp-subkey: ${{ secrets.SIGNING_OPENPGP_SUBKEY }}
          signing-alpine-key: ${{ secrets.SIGNING_ALPINE_KEY }}
          upload-ssh-key: ${{ secrets.UPLOAD_SSH_KEY }}
          upload-known-hosts: ${{ vars.UPLOAD_KNOWN_HOSTS }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: signed-packages-${{ needs.verify.outputs.program }}
          path: dist
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: freebsd-repo-${{ needs.verify.outputs.program }}-*
          merge-multiple: true
          path: dist/${{ needs.verify.outputs.program }}
      # The repository the tests used holds this version only. The one that is published is made
      # from what is published now, so every older version stays.
      - name: Start from what is published
        run: |
          rm -rf "dist/$PROGRAM/repo"
          make program-fetch PROGRAM="$PROGRAM"
      # Stops here when the tar of a FreeBSD release is missing: the published catalog of its
      # major version would stay in place, and the publish step would not notice.
      - name: Add the FreeBSD packages and catalogs of every release
        run: make freebsd-unpack PROGRAM="$PROGRAM"
      - name: Build the signed package repositories
        run: make repo PROGRAM="$PROGRAM"
      # Nothing is uploaded before this step, so a build that failed or a file that is missing
      # above publishes nothing.
      - name: Publish the repositories
        run: make program-publish PROGRAM="$PROGRAM"
      - name: Remove the secret files
        if: always()
        uses: ./.github/actions/remove-release-keys

  # The change log page of splicefs.org is built from the change logs of the programs, so the
  # website is published again after every release. This job runs outside the publish
  # environment and holds none of its keys. When it fails, the packages are out all the same.
  website:
    name: Rebuild the change log page of the website
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Bot token for the website repository
        id: bot
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.RELEASE_BOT_PRIVATE_KEY }}
          owner: SpliceFS
          repositories: org-site
      - name: Ask the website to publish again
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: gh api repos/SpliceFS/org-site/dispatches -f event_type=release-published

  # The Homebrew formulas install the newest release, so the tap is told about this one. It
  # then opens a pull request that tests the new version on macOS before it is merged. This
  # job runs outside the publish environment and holds none of its keys. When it fails, the
  # packages are out all the same.
  homebrew:
    name: Tell the Homebrew tap about this version
    needs: publish
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Ask the tap to update its formulas
        env:
          GH_TOKEN: ${{ secrets.MERGE_BOT_TOKEN }}
        run: gh api repos/SpliceFS/homebrew-tap/dispatches -f event_type=release-published

  # A failed run of this workflow opens an issue assigned to the account in the repository
  # variable ALERT_ASSIGNEE, so that someone gets an email; GitHub sends none for runs the
  # bots start.
  alert:
    name: Report a failure
    needs: [verify, wait, revision, packages, freebsd, tests, publish, website, homebrew]
    if: ${{ failure() }}
    permissions:
      issues: write
    uses: SpliceFS/.github/.github/workflows/report-failure-v1.yml@main
    with:
      assignee: ${{ vars.ALERT_ASSIGNEE }}
